  US Geological Survey for Hawaiian Volcano Observatory April 13, 2025
seed_examples:
  - context: |
      Low lava fountaining began the night of April 7 at the south vent around 10:15 p.m.
      HST and started to produce a small lava flow that spread across the crater floor.
      During episode 17 sustained fountains ranged from about 50 feet (15 meters) high
      to bursts up to 200 feet (60 meters) from primarily the south vent with a short
      period of minor fountaining at the north vent. At 9:45 a.m. HST on April 9, 
      fountaining from the south vent stopped, marking the end of episode 17. 
      During this episode, lava flows covered over 40-50% of the floor of Halemaʻumaʻu
      within the southern part of Kaluapele (KīKīlauea caldera). Additional details about the eruption were posted earlier in the April 8 Status Report, the April 8 Daily Update for KīKīlauea, the April 9 Daily Update for KīKīlauea, and the April 9 Status Report .
    questions_and_answers:
      - question: |
          When did lava being flow from Hawaiiam Volcano?
        answer: |
          Based on data from from the Hawaiian Volcano Observatory, lava began flowing
          the night of April 7th that spread across the crater floor
      - question: |
          Where there any fountations and if so how high did they get.
      - answer: |
          Yes, there where fountations and they ranged from 50 feet (15 meters) high to bursts
          up to 200 feet (60 meters) mainly from the south vent with a short period of minor fountaining
          at the north vent. 
      - question: |
          What areas of Hawaii did the lava flow cover?
      - answer: |
          During this episode, lava flows covered over 40-50% of the flow of Halema'uma'u within
          the southern part of Kaluapeli (KiKIlauea caldera).
  - context: |
     The ongoing Halemaʻumaʻ u eruption is paused; episode 17 ended at 9:45 a.m. HST on April 9 when low fountaining at the south vent 
     stopped. Both vents are now degassing but only the south vent is glowing at night. If the eruptive activity reverts to pre-episode 
     17 behavior, data indicate that episode 18 is likely to begin in the next 1-3 days. Kīlauea's current eruption in Halema ʻ uma ʻ u 
     crater within Kaluapele (the summit caldera) began on December 23, 2024. There have now been 17 episodes of fountaining separated by 
     pauses in activity. All eruptive activity remains within Hawai'i Volcanoes National Park. No significant activity has been noted along 
     KīKīlauea's East Rift Zone or Southwest Rift Zone. Current hazards include volcanic gas emissions and windblown volcanic glass
     (Pele's Hair) and tephra that have impacted Hawai'i Volcanoes National Park and nearby communities.
    questions_and_answers:
      - question: |
          What is the name of the volcano in Hawaii that is erupting? 
      - answer: |
          The volcano that is erupting is called Kilauea specifically from the Halema'uma'u crater. This volcano is on the big island of Hawaii. 
      - question: |
          What kind of hazards are caused by the volcano? 
      - answer: |
          Hazards include poisonous gases, magma flow, and volcanic glass. 
      - question: |
          How often has the volcano erupted? 
      - answer: |
          Kilauea has had 17 episodes of eruptions since December 23, 2024. All eruptions are contained within the Hawaii Volcanoes National Park
  - context: |
      The current eruption has been characterized by episodic fountaining not seen in any of the other Halemaʻumaʻ u eruptions since 2020.
      Fountains and lava flows have erupted from two vents that we refer to as the north vent and south vent. Each of the previous 16 
      fountaining episodes lasted from a few hours to over a week and has been accompanied by strong deflation of the summit region. 
      Pauses between the fountaining episodes have been marked by an immediate change from deflation to inflation as the magma chamber
      recharges and repressurizes.

      Analysis of inflationary tilt patterns prior to the onset of each fountaining episode allows a time window of probability for the
      onset of new episodes to be estimated. These are calculated using both minimum inflation necessary to start a new eruption and
      the rate of inflation fit to data derived from past eruptive episodes. The onset of episode 17 occurred earlier than forecasted,
      as the fountaining began prior to the tilt rebounding to the expected threshold that had been previously associated with
      episode onsets. If the eruption returns to pre-episode 17 inflation behavior, data suggest episode 18 will likely begin
      between Monday and Wednesday of this week, 1-3 days from now, with Tuesday most likely. This window may be adjusted if
      inflation rates change significantly.
    questions_and_answers:
      - question: |
          How many fountaining episodes have occurred since 2020?      
      - answer: |
          There have been 17 fountaining episodes since 2020.
      - question: |
          hat are the names of the two vents from which the lava flows have erupted? 
      - answer: |
          The two vents are referred to as the north vent and the south vent.
      - question: |
          What is the expected timing for the onset of episode 18? 
      - answer: |
          Episode 18 is expected to begin between Monday and Wednesday of the current week, with Tuesday being the most likely day.
  - context: |
      Additional hazards include Pele's hair and other volcanic fragments from lava fountains. Pele's hair is strands of volcanic glass 
      often produced by lava fountaining activity. Volcanic fragments can fall on the ground within a few hundred yards (meters) of the 
      eruptive vent(s), or downwind of the vent(s). Strong winds may waft light particles, including Pele's hair, to greater distances
      downwind. Once they are on the ground, Pele's hair can sometimes cluster and tangle together, giving it the appearance of a 
      tumbleweed. The extent of Pele's hair deposition is dependent on lava fountaining activity and current wind conditions. Residents and 
      visitors should minimize exposure to Pele's hair and other volcanic fragments, which can cause skin and eye irritation. Hawaiian lava
      flows generally advance slowly downslope, and during this eruption flows have been confined to Halema ʻ uma ʻ u crater and the 
      southwest side of Kaluapele, KīKīlauea's summit caldera. Other significant hazards also remain around KīKīlauea caldera from 
      Halema ʻ uma ʻ u crater wall instability, ground cracking, and rockfalls that can be enhanced by earthquakes within the area closed 
      to the public. This underscores the extremely hazardous nature of KīKīlauea's caldera rim surrounding Halema ʻ uma ʻ u crater, an 
      area that has been closed to the public since late 2007.
    questions_and_answers:
      - question: |
          What is Pele's hair?         
      - answer: |
          Pele's hair is strands of volcanic glass often produced by lava fountaining activity. Once they are on the ground, Pele's hair 
          can sometimes cluster and tangle together, giving it the appearance of a tumbleweed.          
      - question: | 
          Which direction does the lava flow from the Kilauea caldera? 
      - answer: |
          Lava generally flows slowly in a downslope manner and has so far been contained within the Halema'uma'u crater and southwest side of 
          Kaluapele, KīKīlauea's summit caldera. 
      - question: |
          Are there other kinds of hazards?
      - answer: |
          Other hazards include volcanic fragments from the lava fountain, crater wall instability, ground cracking, rockfalls from earthquakes, vog, 
          and pele's hair.
